[build-system]
requires = [
  "hatchling>=1.27",
  "hatch-vcs",
]
build-backend = "hatchling.build"

[project]
name = "boundary-cli"
dynamic = ["version"]
description = "Persistent project contracts and operation authorization for coding agents."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[tool.hatch.version]
source = "vcs"

[project.scripts]
boundary = "boundary.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/boundary",
]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "boundary_assets/skills"
"adapters" = "boundary_assets/adapters"
